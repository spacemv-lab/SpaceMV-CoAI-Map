services:
  db:
    image: postgis/postgis:15-3.3
    container_name: txwx-postgis
    restart: always
    env_file:
      - ../../.envs/map-ai/dev/docker.env
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - ../../pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - db

  redis:
    image: redis:7.2-alpine
    container_name: txwx-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - ../../redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      default:
        aliases:
          - redis

  # MinIO for local development
  # 本地开发用 MinIO，staging/production 使用内网/外网 MinIO
  minio:
    image: quay.io/minio/minio:latest
    container_name: txwx-minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - ../../.envs/map-ai/dev/docker.env
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - ../../miniodata:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      default:
        aliases:
          - minio

  # TiTiler —— 动态栅格瓦片服务(读 MinIO 里的 COG,出 XYZ 瓦片供浏览器直连)
  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    container_name: txwx-titiler
    restart: always
    env_file:
      - ../../.envs/map-ai/dev/docker.env
    environment:
      # MinIO S3(GDAL/rasterio 读栅格);凭证 AWS_ACCESS_KEY_ID/SECRET 由 docker.env 提供(= MinIO root)
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_S3_ENDPOINT=minio:9000
      - AWS_VIRTUAL_HOSTING=FALSE
      - AWS_HTTPS=FALSE
      - AWS_REGION=us-east-1
      # 浏览器来源(MapLibre 直连取瓦片)
      - TITILER_API_CORS_ORIGINS=http://localhost:4200,http://127.0.0.1:4200
      # 关闭 /vsis3 目录缓存:否则每上传一个新 COG,TiTiler 都得重启才能读到(缓存了旧目录列表)
      - GDAL_DISABLE_READDIR_ON_OPEN=YES
      - CPL_VSIL_CURL_CACHEDIR_EXPIRATION=0
    ports:
      - '127.0.0.1:8002:80'
    depends_on:
      - minio
    networks:
      default:
        aliases:
          - titiler

networks:
  default:
    name: txwx-local-network
